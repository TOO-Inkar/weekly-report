name: Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew build

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: /home/bpa-admin/deploy.sh weekly-report
