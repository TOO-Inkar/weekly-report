services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weeklyreport}
      POSTGRES_USER: ${POSTGRES_USER:-weeklyreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weeklyreport}
    ports:
      - "${POSTGRES_PORT:-6868}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weeklyreport} -d ${POSTGRES_DB:-weeklyreport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-1g}
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SOURCE_CHANNEL_ID: ${TELEGRAM_SOURCE_CHANNEL_ID}
      TELEGRAM_REPORT_CHAT_ID: ${TELEGRAM_REPORT_CHAT_ID}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-weeklyreport}?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-weeklyreport}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-weeklyreport}
      WEEKLY_REPORT_CRON: ${WEEKLY_REPORT_CRON:-0 0 9 * * MON}
      WEEKLY_REPORT_TIMEZONE: ${WEEKLY_REPORT_TIMEZONE:-Asia/Almaty}
      DIVISIONS_FILE_PATH: /data/divisions.xlsx
      DARIBAR_CROSSWALK_PATH: /data/daribar_crosswalk.xlsx
      SMTP_HOST: ${SMTP_HOST:-mail.inkar.kz}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-weekly-report@inkar.kz}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEEKLY_REPORT_EMAIL_RECIPIENTS: ${WEEKLY_REPORT_EMAIL_RECIPIENTS:-}
    volumes:
      - ./data:/data:ro

volumes:
  postgres_data:
